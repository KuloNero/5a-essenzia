name: Pubblica app su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepara sito statico
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js sw-shell.js sw-classic.js css js vendor icons _site/
          BUILD="${GITHUB_SHA::7}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sed -i "s/__BUILD_DATE__/$DATE/; s/__BUILD__/$BUILD/" _site/js/version.js
          # nuova cache e service worker diverso a ogni pubblicazione → aggiornamento rilevato dai dispositivi
          sed -i "s/const VERSION = 'esz-v\([0-9.]*\)';/const VERSION = 'esz-v\1-$BUILD';/" _site/sw-shell.js
          sed -i "s/__BUILD__/$BUILD/" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
